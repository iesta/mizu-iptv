# Manifeste Flatpak — Mizu IPTV
#
# Construit un Flatpak à partir du bundle Flutter déjà compilé sur l'hôte
# (le SDK Flutter n'est pas embarqué dans le bac à sable : c'est plus simple
# et reproductible). Voir tools/package-flatpak.sh.
#
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/app.mizu.iptv.yml
app-id: app.mizu.iptv
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: mizu_iptv
finish-args:
  # Affichage
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Réseau (Supabase, panneaux IPTV, TMDB)
  - --share=network
  # Certains panneaux sont en HTTP simple : le bac à sable n'y change rien,
  # mais l'app doit pouvoir écrire sa config locale.
  - --persist=.config/mizu
modules:
  - name: mizu
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/mizu
      - cp -a . /app/lib/mizu/
      - install -Dm755 /app/lib/mizu/mizu_iptv /app/bin/mizu_iptv
      - install -Dm644 app.mizu.iptv.desktop /app/share/applications/app.mizu.iptv.desktop
      - install -Dm644 app.mizu.iptv.png /app/share/icons/hicolor/256x256/apps/app.mizu.iptv.png
    sources:
      # Le bundle compilé est copié ici par tools/package-flatpak.sh
      - type: dir
        path: @BUNDLE@
      - type: file
        path: app.mizu.iptv.desktop
      - type: file
        path: app.mizu.iptv.png
