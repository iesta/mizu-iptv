name: release

# Publie les artefacts sur une release GitHub quand un tag v* est poussé.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Jobs :
#   linux   x86_64 (ubuntu-latest)            → AppImage
#   android                                   → APK release par ABI
#   macos   arm64 (macos-14)                  → .app zippé (prêt pour le cask)
#
# Deux variantes de build :
#
#   vanilla (défaut, tags) : aucun `.env`, donc aucune clé dans l'artefact.
#                            L'app demande sa configuration au premier
#                            lancement (ou `tools/get.sh` l'écrit).
#   zen                    : configuration Zen IPTV compilée dans le binaire,
#                            l'app est prête à l'emploi. Lancé à la demande
#                            (workflow_dispatch) ; les valeurs viennent des
#                            *variables* du dépôt, jamais du code :
#                              gh variable set ZEN_BACKEND_URL  --body https://api.zeniptv.app
#                              gh variable set ZEN_PUBLISHABLE_KEY --body sb_publishable_…
#                            Les fichiers sont suffixés `-zen`.
#
# Linux arm64 : Flutter ne publie pas de SDK Linux arm64 (uniquement x86_64),
# il n'y a donc pas de job aarch64. Voir README (« Distribution Linux »).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      flavor:
        description: "vanilla = sans config, zen = config Zen embarquée"
        type: choice
        options: [vanilla, zen]
        default: vanilla

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLAVOR: ${{ inputs.flavor || 'vanilla' }}

jobs:
  linux:
    name: Linux x86_64 (${{ inputs.flavor || 'vanilla' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev \
            libfuse2t64 || sudo apt-get install -y libfuse2

      - name: Configuration embarquée (variante zen)
        if: env.FLAVOR == 'zen'
        run: |
          if [ -z "${{ vars.ZEN_PUBLISHABLE_KEY }}" ]; then
            echo "::error::vars.ZEN_PUBLISHABLE_KEY n'est pas défini sur le dépôt"
            exit 1
          fi
          cat > .env <<EOF
          MIZU_BACKEND_URL=${{ vars.ZEN_BACKEND_URL }}
          MIZU_PUBLISHABLE_KEY=${{ vars.ZEN_PUBLISHABLE_KEY }}
          EOF
          echo "variante zen : configuration compilée depuis les variables du dépôt"

      - name: AppImage
        run: |
          ./tools/package-appimage.sh
          if [ "$FLAVOR" = "zen" ]; then
            for f in dist/Mizu-IPTV-*.AppImage; do
              mv "$f" "${f%.AppImage}-zen.AppImage"
            done
          fi

      - name: Sommes de contrôle
        run: |
          cd dist
          sha256sum Mizu-IPTV-*.AppImage > SHA256SUMS-linux
          cat SHA256SUMS-linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.FLAVOR }}
          path: |
            dist/Mizu-IPTV-*.AppImage
            dist/SHA256SUMS-linux

      - name: Publication
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Mizu-IPTV-*.AppImage
            dist/SHA256SUMS-linux
          fail_on_unmatched_files: true

  android:
    name: Android APK (${{ inputs.flavor || 'vanilla' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configuration embarquée (variante zen)
        if: env.FLAVOR == 'zen'
        run: |
          if [ -z "${{ vars.ZEN_PUBLISHABLE_KEY }}" ]; then
            echo "::error::vars.ZEN_PUBLISHABLE_KEY n'est pas défini sur le dépôt"
            exit 1
          fi
          cat > .env <<EOF
          MIZU_BACKEND_URL=${{ vars.ZEN_BACKEND_URL }}
          MIZU_PUBLISHABLE_KEY=${{ vars.ZEN_PUBLISHABLE_KEY }}
          EOF

      - name: Build APK (par ABI)
        run: |
          cd app
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Renommer
        run: |
          mkdir -p dist
          V="${GITHUB_REF_NAME}"
          SUFFIX=""
          [ "$FLAVOR" = "zen" ] && SUFFIX="-zen"
          for f in app/build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')"
            cp "$f" "dist/Mizu-IPTV-${V}-${abi}${SUFFIX}.apk"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.FLAVOR }}
          path: dist/Mizu-IPTV-*.apk

      - name: Publication
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mizu-IPTV-*.apk
          fail_on_unmatched_files: true

  macos:
    name: macOS arm64 (${{ inputs.flavor || 'vanilla' }})
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configuration embarquée (variante zen)
        if: env.FLAVOR == 'zen'
        run: |
          if [ -z "${{ vars.ZEN_PUBLISHABLE_KEY }}" ]; then
            echo "::error::vars.ZEN_PUBLISHABLE_KEY n'est pas défini sur le dépôt"
            exit 1
          fi
          cat > .env <<EOF
          MIZU_BACKEND_URL=${{ vars.ZEN_BACKEND_URL }}
          MIZU_PUBLISHABLE_KEY=${{ vars.ZEN_PUBLISHABLE_KEY }}
          EOF

      - name: Build + archive
        run: |
          ./tools/package-macos.sh
          if [ "$FLAVOR" = "zen" ]; then
            for f in dist/Mizu-IPTV-*.zip; do
              mv "$f" "${f%.zip}-zen.zip"
            done
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.FLAVOR }}
          path: dist/Mizu-IPTV-*.zip

      - name: Publication
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mizu-IPTV-*.zip
          fail_on_unmatched_files: true
